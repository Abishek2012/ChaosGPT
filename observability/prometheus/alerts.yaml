groups:
- name: aegisml-slo
  rules:
  - alert: AegisMLHighP95Latency
    expr: histogram_quantile(0.95, sum(rate(aegisml_inference_latency_seconds_bucket[5m])) by (le)) > 0.25
    for: 10m
    labels: {severity: warning}
    annotations: {summary: "AegisML inference p95 exceeds 250ms"}
  - alert: AegisMLHighErrorRate
    expr: sum(rate(aegisml_inference_errors_total[5m])) / clamp_min(sum(rate(aegisml_inferences_total[5m])), 1) > 0.01
    for: 10m
    labels: {severity: critical}
    annotations: {summary: "AegisML inference error rate exceeds 1%"}
  - alert: AegisMLCrashLooping
    expr: increase(kube_pod_container_status_restarts_total{namespace="ml-platform",pod=~"aegisml-inference.*"}[15m]) > 3
    for: 5m
    labels: {severity: critical}
    annotations: {summary: "AegisML pods are repeatedly restarting"}
