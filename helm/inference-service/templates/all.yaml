apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Values.serviceAccount }}, labels: {app.kubernetes.io/name: aegisml-inference}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: aegisml-inference-config}
data: {MODEL_VERSION: development}
---
apiVersion: v1
kind: Secret
metadata: {name: aegisml-inference-secrets}
type: Opaque
stringData: {OTEL_EXPORTER_OTLP_ENDPOINT: ""}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aegisml-inference, labels: {app.kubernetes.io/name: aegisml-inference}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: aegisml-inference}}
  template:
    metadata: {labels: {app.kubernetes.io/name: aegisml-inference, aegisml.io/chaos-approved: "true"}}
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080, name: http}]
        envFrom: [{configMapRef: {name: aegisml-inference-config}}, {secretRef: {name: aegisml-inference-secrets}}]
        resources: {{- toYaml .Values.resources | nindent 10 }}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10}
        readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 5}
        startupProbe: {httpGet: {path: /ready, port: http}, failureThreshold: 30, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: aegisml-inference, labels: {app.kubernetes.io/name: aegisml-inference}}
spec: {selector: {app.kubernetes.io/name: aegisml-inference}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: aegisml-inference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: aegisml-inference}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.cpu }}}}
  - type: Resource
    resource: {name: memory, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.memory }}}}
  # Requires Prometheus Adapter rule mapping aegisml_http_requests_total to this external metric.
  - type: External
    external: {metric: {name: aegisml_requests_per_second}, target: {type: AverageValue, averageValue: "20"}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: aegisml-inference}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: aegisml-inference}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: aegisml-inference-default-deny}
spec: {podSelector: {matchLabels: {app.kubernetes.io/name: aegisml-inference}}, policyTypes: [Ingress, Egress], ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]}], egress: [{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]}]}
