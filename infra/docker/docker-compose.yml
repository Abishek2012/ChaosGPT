services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaosgpt
      POSTGRES_USER: chaosgpt
      POSTGRES_PASSWORD: chaosgpt
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  nats:
    image: nats:2.10-alpine
    ports: ["4222:4222", "8222:8222"]
  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports: ["6333:6333"]
  prometheus:
    image: prom/prometheus:v2.53.1
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
