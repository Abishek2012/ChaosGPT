apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: chaosgpt-pod-delete
  namespace: production-canary
spec:
  appinfo:
    appns: production-canary
    applabel: app=checkout
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: CHAOS_INTERVAL
              value: "10"
