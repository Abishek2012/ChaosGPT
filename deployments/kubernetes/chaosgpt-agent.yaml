apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaosgpt-agent
  labels:
    app.kubernetes.io/name: chaosgpt-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chaosgpt-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaosgpt-agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/example/chaosgpt-agent:0.1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chaosgpt-agent
spec:
  selector:
    app.kubernetes.io/name: chaosgpt-agent
  ports:
    - name: http
      port: 80
      targetPort: 8000
